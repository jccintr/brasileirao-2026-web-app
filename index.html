<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Brasileirão 2026 — classificação, rodadas e jogos de cada equipe da Série A do Campeonato Brasileiro." />
    <meta name="theme-color" content="#0E1410" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#009739" media="(prefers-color-scheme: light)" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <title>Brasileirão 2026</title>
    <script>
      // Aplica o tema antes do React carregar, para não "piscar" claro->escuro.
      // Mantenha a lógica em sincronia com src/context/ThemeContext.jsx.
      (function () {
        try {
          var pref = localStorage.getItem('brasileirao2026:theme');
          var dark =
            pref === 'dark' ||
            (pref !== 'light' && window.matchMedia('(prefers-color-scheme: dark)').matches);
          document.documentElement.classList.toggle('dark', dark);
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
